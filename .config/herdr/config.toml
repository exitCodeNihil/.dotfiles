onboarding = false

[keys]
prefix = "ctrl+a"
rename_tab = "prefix+,"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
previous_workspace = "ctrl+p"
next_workspace = "ctrl+n"
previous_agent = "ctrl+o"
next_agent = "ctrl+y"

[theme]
name = "tokyo-night"

[ui.sound]
enabled = true

[ui]
show_agent_labels_on_pane_borders = false
