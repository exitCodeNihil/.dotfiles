# --- Base settings ---
set -g focus-events on
set -g default-terminal "tmux-256color"
# set -ga terminal-features "*:RGB:sync"

# Change prefix key from C-b to C-a
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Split panes using | and -
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Resize panes with vim keys
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Toggle pane zoom
bind -r m resize-pane -Z

bind M-c attach-session -c "#{pane_current_path}"

# Enable mouse
set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 0

setw -g aggressive-resize on

# Status bar on top
set -g status-position bottom

# Start numbering at 1
set -g base-index 1

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'dracula/tmux'

set -g @dracula-show-powerline true
# set -g @dracula-fixed-location "New York City"
# set -g @dracula-plugins "weather"
set -g @dracula-plugins "git time"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-show-location false
set -g @dracula-military-time true
set -g @dracula-refresh-rate 5

# set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

# --- Initialize TPM ---
run '~/.tmux/plugins/tpm/tpm'

set -g status-interval 5
set -g status-right-length 250
#set -g status-right "#[fg=#50fa7b,bg=#44475a,nobold,nounderscore,noitalics]#[fg=#282a36,bg=#50fa7b] #(/Users/nihil/.tmux/plugins/tmux/scripts/git.sh)  #[fg=#6272a4,bg=#50fa7b,nobold,nounderscore,noitalics]#[fg=#f8f8f2,bg=#6272a4] #{pane_current_path}  #[fg=#6272a4,bg=#6272a4,nobold,nounderscore,noitalics]#[fg=#f8f8f2,bg=#6272a4] %R #(date +%Z)  "
set -g status-right "#[fg=#50fa7b,bg=#44475a,nobold,nounderscore,noitalics]#[fg=#282a36,bg=#50fa7b] #(/Users/nihil/.tmux/plugins/tmux/scripts/git.sh)  #[fg=#6272a4,bg=#50fa7b,nobold,nounderscore,noitalics]#[fg=#f8f8f2,bg=#6272a4] #{pane_current_path} "
